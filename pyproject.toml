[project]
name = "paper-trading-floor"
version = "2.0.0"
description = "Three stdio MCP servers and a deterministic paper floor over synthetic fixtures. No venue."
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "streamlit>=1.40,<2", "pandas>=2.2,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ai = ["crewai>=1.0,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
